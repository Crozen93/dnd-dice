name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon || (sleep 30 && gradle assembleDebug --no-daemon --refresh-dependencies)

      - uses: actions/upload-artifact@v4
        with:
          name: dnd-dice-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dnd-dice.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dnd-dice.apk --title "D&D Кубики — последняя сборка" --notes "Автосборка из main (${GITHUB_SHA::7})" --target "$GITHUB_SHA"
